@if (visible) {
	<div class="confirm-backdrop" (click)="onBackdropClick()">
		<div class="confirm-card update" (click)="$event.stopPropagation()">
			<div class="confirm-icon-shell">
				<mat-icon>edit_square</mat-icon>
			</div>

			<div class="confirm-copy">
				<h3>{{ title }}</h3>
				<p>{{ message }}</p>
			</div>

			<div class="confirm-actions">
				<button type="button" class="secondary-btn" (click)="onCancel()">{{ cancelLabel }}</button>
				<button type="button" class="primary-btn" (click)="onConfirm()">{{ confirmLabel }}</button>
			</div>
		</div>
	</div>
}
